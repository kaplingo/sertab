<style>

.roundbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bubble{border-radius:100px;background:var(--pale);color:var(--primary-dark);padding:8px 13px;font-size:12px;font-weight:900}.counter{color:var(--primary-dark);font-size:13px;font-weight:950}.word-card{display:flex;align-items:center;justify-content:center;gap:12px;align-self:stretch;padding:clamp(16px,3vh,30px);border-radius:24px;background:var(--pale);border:2px solid var(--line);position:relative}.sound{width:43px;height:43px;border:0;background:#fff;border-radius:14px;box-shadow:0 4px 0 #00000010;display:grid;place-items:center;font-size:21px;cursor:pointer;flex-shrink:0}.sound:active{transform:translateY(3px)}

.fill-preview{display:grid;gap:8px;padding:clamp(13px,2vw,22px);border:1px solid var(--line);border-radius:20px;background:var(--pale)}.fill-preview .translation{font-size:clamp(20px,3.2vw,31px);font-weight:900;line-height:1.3}.cloze{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;padding:clamp(15px,2.6vw,25px);border:2px dashed var(--line);background:#fff;border-radius:20px;font-weight:950;font-size:clamp(21px,3vw,33px);text-align:center}.cloze input{border:2px solid var(--primary);border-radius:13px;min-width:120px;width:clamp(138px,34vw,365px);max-width:100%;text-align:center;padding:11px 13px;font-family:inherit;font-size:clamp(18px,2.8vw,26px);font-weight:900;line-height:1.25;outline:none;color:var(--ink);background:#fff}.cloze input:focus{box-shadow:0 0 0 4px var(--pale)}.cloze input.correct{border-color:#54b781;background:#effcf3}.cloze input.wrong{border-color:#d87983;background:#fff6f6}.cloze input::placeholder{font-weight:650;color:#b2a5a9}
.lyric-card{background:var(--pale);border:2px solid var(--line);border-radius:23px;padding:clamp(17px,3vw,30px);display:flex;flex-direction:column;align-items:center;gap:10px}.lyric-card blockquote{margin:0;font-size:clamp(24px,3.9vw,37px);line-height:1.4;font-weight:950;text-align:center;max-width:760px}.sample-answer{border-left:5px solid var(--primary);background:white;padding:15px 18px;border-radius:14px;line-height:1.5;font-size:clamp(15px,1.9vw,19px)}
textarea{min-height:clamp(95px,19vh,150px);resize:vertical;width:100%;padding:15px;border:2px solid var(--line);background:white;border-radius:18px;outline:none;font:650 clamp(14px,1.6vw,17px)/1.5 system-ui,sans-serif;color:var(--ink)}textarea:focus{border-color:var(--primary)}
.actionbar{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-shrink:0;margin-top:clamp(10px,1.8vh,18px)}.actionbar .meta{margin-right:auto;font-size:clamp(11px,1.3vw,13px);color:var(--muted);font-weight:750}.btn{border:0;border-radius:15px;padding:clamp(11px,1.5vh,14px) clamp(14px,2.2vw,23px);font-family:inherit;font-size:clamp(13px,1.6vw,16px);font-weight:900;white-space:nowrap;cursor:pointer;box-shadow:0 5px 0 #00000013}.btn.primary{color:white;background:var(--primary);box-shadow:0 5px 0 var(--primary-dark)}.btn.ghost{color:var(--primary-dark);background:var(--pale)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #00000020}.btn.tiny{padding:9px 13px}.clickable{cursor:pointer}.done-stat{font-size:clamp(28px,4.5vw,50px);color:#387a58;font-weight:1000}.huge{font-size:clamp(55px,10vh,94px)}.hide{display:none!important}

@media(max-width:650px){.shell{padding:8px;gap:7px}.brand small{font-size:10px}.pill{padding:6px 8px;font-size:10px}.sections{gap:4px}.section-item{padding:7px 2px;font-size:9px}.sheet{border-radius:21px;padding:14px}.choices{grid-template-columns:1fr}.choice{min-height:63px}.panels{grid-template-columns:1fr}.heading{font-size:clamp(22px,6vw,30px)}.word-card{padding:16px}.bigword{font-size:clamp(30px,10vw,48px)}.content{justify-content:center}.btn{padding:10px 12px}.actionbar .meta{display:none}.cloze{padding:12px}.cloze input{width:100%;min-width:0}.grammar-phrase{font-size:22px}}

<body data-section="0">
<div class="shell">
  <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">🎵</span><div><strong>Yolun Başı</strong><small>Sertab Erener · B1 Türkçe</small></div></div><span class="pill" id="sectionBadge">Türkçe öğreniyorum</span></header>
  <div class="progress" role="progressbar" aria-label="Ders ilerlemesi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><span id="barFill"></span></div>
  <div class="sections" id="sectionNav" aria-label="Ders bölümleri"></div>
  <main class="sheet"><div id="content" class="content" aria-live="polite"></div><footer class="actionbar" id="footer"><span class="meta" id="footerMeta"></span><button class="btn ghost" id="back" onclick="stepBack()">← Geri</button><button class="btn primary" id="next" onclick="stepNext()">İleri →</button></footer></main>
</div>
<script>
'use strict';
const sections=['Kelimeler','Türkçe Anlam','-DIK','Boşluk Doldur','Şarkının Anlamı','İngilizce Çeviri'];
const words=[
 {tr:'Duvar',en:'wall',wrong:['door','floor','ceiling']},
 {tr:'Kaldırmak',en:'to take down / remove',wrong:['to hang up','to put on','to wait for']},
 {tr:'Özlemek',en:'to miss someone',wrong:['to forget someone','to meet someone','to find someone']},
 {tr:'Bardak',en:'glass',wrong:['plate','bottle','fork']},
 {tr:'Saklamak',en:'to hide / keep',wrong:['to show','to throw away','to borrow']},
 {tr:'Unutmak',en:'to forget',wrong:['to remember','to learn','to notice']},
 {tr:'Raf',en:'shelf',wrong:['drawer','carpet','lamp']},
 {tr:'Katlamak',en:'to fold',wrong:['to cut','to wash','to tear']},
 {tr:'Korkmak',en:'to be afraid',wrong:['to be proud','to be sure','to be tired']},
 {tr:'Damla',en:'drop',wrong:['river','stone','sea']},
 {tr:'Ağlamak',en:'to cry',wrong:['to laugh','to smile','to dance']},
 {tr:'Sevda',en:'deep love',wrong:['anger','envy','jealousy']},
 {tr:'Omuz',en:'shoulder',wrong:['knee','ankle','elbow']},
 {tr:'Dönmek',en:'to turn / return',wrong:['to wait','to stay','to sit']},
 {tr:'Yürek',en:'heart',wrong:['back','eye','finger']}
];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const vocabulary=[];
// İlk tur: 15 kelimenin tamamı. İkinci tur: 12 farklı kelime daha (toplam 27).
const firstOrder=shuffle(words.map((_,i)=>i));
const secondOrder=shuffle(words.map((_,i)=>i)).slice(0,12);
if(secondOrder[0]===firstOrder[firstOrder.length-1]){
 const swap=secondOrder.findIndex(i=>i!==firstOrder[firstOrder.length-1]);
 [secondOrder[0],secondOrder[swap]]=[secondOrder[swap],secondOrder[0]];
}
for(const [round,order] of [firstOrder,secondOrder].entries()){
 for(const wordIndex of order){
  const word=words[wordIndex],wrong=word.wrong[round],correctAt=Math.random()<.5?0:1;
  const options=correctAt===0?[word.en,wrong]:[wrong,word.en];
  vocabulary.push({wordIndex,round,options,correctAt});
 }
}
const definitions=[
 {q:'Bir kişiyi görmek istemek.',options:['Özlemek','Unutmak'],correctAt:0},
 {q:'Bir şeyi gizli bir yere koymak.',options:['Katlamak','Saklamak'],correctAt:1},
 {q:'Kıyafetleri düzenli bir şekilde bükmek.',options:['Katlamak','Kaldırmak'],correctAt:0},
 {q:'Bir resmi duvardan almak.',options:['Kaldırmak','Ağlamak'],correctAt:0},
 {q:'Kol ile boyun arasındaki bölüm.',options:['Yürek','Omuz'],correctAt:1}
];
const grammar=[
 {type:'overview'},
 {type:'example',phrase:'Çay içtiğin bardak',parts:['iç','tiğ','in'],labels:['drink','-DIK relative suffix','you'],literal:'tea + drink-REL-you + glass',natural:'the glass (that) you drank tea from',explain:'The whole phrase “çay içtiğin” describes “bardak”. The person who drank tea is you.'},
 {type:'example',phrase:'Sevdiğin şarkı',parts:['sev','diğ','in'],labels:['like / love','-DIK relative suffix','you'],literal:'like-REL-you + song',natural:'the song (that) you like',explain:'The word “sevdiğin” describes “şarkı”. -in tells us that you are the person who likes the song.'},
 {type:'example',phrase:'Sen sandığım şey',parts:['san','dığ','ım'],labels:['think / assume','-DIK relative suffix','I'],literal:'you + think-REL-I + thing',natural:'the thing (that) I thought was you',explain:'The word “sandığım” describes “şey”. -ım tells us that I am the person making the assumption.'}
];
const blanks=[
 {en:'the glass you drank tea from',before:'Çay iç',after:' bardak',answer:'tiğin',level:'Only the suffix',explain:'iç + tiğ + in = içtiğin'},
 {en:'everything you wore',before:'Giy',after:' ne varsa',answer:'diğin',level:'Only the suffix',explain:'giy + diğ + in = giydiğin'},
 {en:'the song you like',before:'',after:' şarkı',answer:'sevdiğin',level:'The complete verb form',explain:'sev + diğ + in = sevdiğin'},
 {en:'the thing I thought was you',before:'Sen ',after:' şey',answer:'sandığım',level:'The complete verb form',explain:'san + dığ + ım = sandığım'},
 {en:'everything you wore',before:'',after:'',answer:'Giydiğin ne varsa',level:'The whole Turkish phrase',explain:'giydiğin + ne varsa'},
 {en:'the thing I thought was you',before:'',after:'',answer:'Sen sandığım şey',level:'The whole Turkish phrase',explain:'sen + sandığım + şey'}
];
const meanings=[
 {q:'Şarkıdaki kişi neden eski eşyaları kaldırıyor?',hint:'Ayrılık ve hatıralar arasında nasıl bir bağlantı var?'},
 {q:'Sizce bu kişi üzgün mü, güçlü mü, yoksa ikisi birden mi?',hint:'Eşyalarını kaldırıyor; ama geçmişi de hatırlıyor.'},
 {q:'Şarkının başında ve sonunda duyguları değişiyor mu?',hint:'Başta neler yapıyor? Sonunda neden memnun?'},
 {q:'Şarkının adı neden “Yolun Başı”? Burada gerçekten bir yoldan mı söz ediliyor?',hint:'Mecaz: “yolun başından dönmek”, bir durumdan erken vazgeçmektir.'}
];
const lyrics=[
 {tr:'Çay içtiğin bardağı rafa sakladım',en:'I put away the glass you drank tea from on the shelf.'},
 {tr:'Giydiğin ne varsa bir bir katladım',en:'I folded everything you wore, one by one.'},
 {tr:'Sevdiğin şarkıyı hiç söylemedim',en:'I never sang the song you loved.'},
 {tr:'Sevdiğimi unut, özleyemedim',en:'Forget that I loved you; I couldn’t bring myself to miss you.'},
 {tr:'Sen sandığım şey belki benim yüreğimdi',en:'Perhaps what I thought was you was my own heart.'}
];
const counts={1:vocabulary.length,2:definitions.length,3:grammar.length,4:blanks.length,5:meanings.length,6:lyrics.length};
let stage=0,page=0,animationTimer=null,hintVisible=false,soundEnabled=true;
let chosen={1:{},2:{}},accepted={1:{},2:{}},clozeAnswers={},clozeChecked={},written={},translations={},sampleShown={};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text){try{if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(text);s.lang='tr-TR';s.rate=.83;window.speechSynthesis.speak(s)}catch(e){}}
function ding(ok){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),n=c.currentTime;const hz=ok?[523,659,784]:[294,247];hz.forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,n+i*.1);g.gain.exponentialRampToValueAtTime(.04,n+i*.1+.018);g.gain.exponentialRampToValueAtTime(.001,n+i*.1+.19);o.start(n+i*.1);o.stop(n+i*.1+.21)});setTimeout(()=>c.close(),600)}catch(e){}}
function cancelAuto(){if(animationTimer!==null){clearTimeout(animationTimer);animationTimer=null}}
function saveOpenAnswer(){if(stage===5){const input=$('writeAnswer');if(input)written[page]=input.value}if(stage===4){const input=$('clozeInput');if(input)clozeAnswers[page]=input.value}if(stage===6){const input=$('translateAnswer');if(input)translations[page]=input.value}}
function setLocation(s,p=0){cancelAuto();saveOpenAnswer();stage=s;page=p;hintVisible=false;render()}
function canAdvance(){if(stage===1||stage===2)return accepted[stage][page]===true;if(stage===4)return clozeChecked[page]===true;return true}
function stepNext(){cancelAuto();saveOpenAnswer();if(stage===7){restart();return}if(!canAdvance())return;if(stage===0){setLocation(1);return}if(page+1<counts[stage]){setLocation(stage,page+1)}else if(stage===6){setLocation(7)}else{setLocation(stage+1)}}
function stepBack(){cancelAuto();saveOpenAnswer();if(stage===0)return;if(stage===7){setLocation(6,lyrics.length-1);return}if(page>0)setLocation(stage,page-1);else if(stage===1)setLocation(0);else setLocation(stage-1,counts[stage-1]-1)}
function choose(index){if(stage!==1&&stage!==2)return;const b=stage,pg=page;if(accepted[b][pg])return;const q=stage===1?vocabulary[page]:definitions[page],correct=q.correctAt===index;chosen[b][pg]=index;accepted[b][pg]=correct;ding(correct);render();if(correct&&stage===1){animationTimer=setTimeout(()=>{animationTimer=null;if(stage===b&&page===pg)stepNext()},720)}}
function clean(value){return String(value??'').normalize('NFC').trim().replace(/[.!?]+$/g,'').replace(/\s+/g,' ').toLocaleLowerCase('tr-TR')}
function captureCloze(){const f=$('clozeInput');if(f){clozeAnswers[page]=f.value;delete clozeChecked[page];const status=$('feedback');if(status){status.innerHTML='';status.className='feedback'}$('next').disabled=true;f.classList.remove('correct','wrong')}}
function checkCloze(){const input=$('clozeInput');if(!input)return;clozeAnswers[page]=input.value;const ok=clean(input.value)===clean(blanks[page].answer);clozeChecked[page]=ok;ding(ok);render()}
function showHint(){saveOpenAnswer();hintVisible=!hintVisible;render()}
function toggleSample(){saveOpenAnswer();sampleShown[page]=!sampleShown[page];render()}
function restart(){cancelAuto();chosen={1:{},2:{}};accepted={1:{},2:{}};clozeAnswers={};clozeChecked={};written={};translations={};sampleShown={};setLocation(0)}
function optionHtml(options,correctAt){let choice=chosen[stage][page],pass=accepted[stage][page]===true;let buttons=options.map((option,i)=>`<button type="button" class="choice ${choice===i?(i===correctAt?'good':'bad'):''} ${pass&&i===correctAt?'good':''}" onclick="choose(${i})" ${pass?'disabled':''}>${esc(option)}</button>`).join('');return `<div class="choices">${buttons}</div><div class="feedback ${choice!==undefined&&!pass?'bad':''}" aria-live="polite">${pass?'✓ Doğru!':choice!==undefined?'Tekrar dene.':''}</div>`}
function render(){
 document.body.dataset.section=String(stage);
 const progressTotal=Object.values(counts).reduce((a,b)=>a+b,0);
 const doneBefore=Array.from({length:Math.max(stage-1,0)},(_,i)=>counts[i+1]||0).reduce((a,b)=>a+b,0);
 const progress=stage===7?100:stage===0?0:Math.round((doneBefore+page)/progressTotal*100);
 $('barFill').style.width=progress+'%';$('bar').setAttribute('aria-valuenow',progress);
 $('sectionBadge').textContent=stage===0?'Türkçe B1':stage===7?'Tamamlandı':`BÖLÜM ${stage} / 6`;
 $('sectionNav').innerHTML=sections.map((name,i)=>`<div class="section-item ${stage===i+1?'active':''} ${(stage>i+1||stage===7)?'completed':''}"><span class="digit">${i+1}</span>${esc(name)}</div>`).join('');
 $('back').disabled=stage===0;$('next').disabled=!canAdvance();
 $('next').textContent=stage===0?'START ▶':stage===7?'Yeniden Başla ↺':stage===6&&page===4?'Bitir ✨':stage===1&&page===26?'Bölüm 2 →':'İleri →';
 $('footerMeta').textContent=(stage>0&&stage<7)?`${page+1} / ${counts[stage]}`:stage===7?'Tebrikler!':'B1 · İnteraktif ders';
 $('footer').classList.toggle('hide',stage===0);
 let html='';
 if(stage===0){html=`<div class="huge">🌸</div><p class="subhead">Sertab Erener ile Türkçe · B1</p><h1 class="bigword" style="font-size:clamp(36px,7vw,66px)">Yolun Başı</h1><p class="lead" style="max-width:510px">Kelimeler, -DIK yapısı, şarkının anlamı ve İngilizce çeviri</p><button class="btn primary" type="button" style="font-size:22px;padding:17px 55px" onclick="setLocation(1)">START ▶</button>`}
 if(stage===1){const q=vocabulary[page],w=words[q.wordIndex];html=`<div class="roundbar"><span class="bubble">BÖLÜM 1 · Kelime eşleştirme</span><span class="counter">Tur ${q.round+1}/2 · ${page+1}/27</span></div><h2 class="heading">What does this word mean in English?</h2><div class="word-card"><h1 class="bigword">${esc(w.tr)}</h1><button class="sound" type="button" aria-label="Türkçe telaffuz" onclick="speak(words[vocabulary[page].wordIndex].tr)">🔊</button></div>${optionHtml(q.options,q.correctAt)}`}
 if(stage===2){const q=definitions[page];html=`<div class="roundbar"><span class="bubble">BÖLÜM 2 · Türkçe anlam</span><span class="counter">${page+1}/5</span></div><p class="question" style="text-align:center;margin:clamp(12px,2.5vh,26px) 0">${esc(q.q)}</p>${optionHtml(q.options,q.correctAt)}`}
 if(stage===3){const x=grammar[page];if(x.type==='overview')html=`<div class="roundbar"><span class="bubble">BÖLÜM 3 · Grammar explanation</span><span class="counter">${page+1}/4</span></div><h2 class="heading english">The Turkish -DIK relative clause</h2><div class="panels english"><div class="panel"><h3>What does -DIK do?</h3><p><b>Verb + -DIK + person ending</b> describes a noun by telling us an action connected to it. The whole describing phrase comes <b>before the noun</b> in Turkish, but usually <b>after it</b> in English.</p></div><div class="panel"><h3>How does it change?</h3><p>-DIK follows <b>vowel harmony</b>: -dık / -dik / -duk / -dük (also -tık / -tik / -tuk / -tük). Before a vowel-initial person ending, <b>k → ğ</b>: sev-diğ-in.</p></div></div><div class="note english"><b>Turkish:</b> <strong>sevdiğin şarkı</strong> = [like-REL-you] + song<br><b>English:</b> the song [that you like]</div><p class="lead english"><b>-in</b> identifies <b>you</b>; <b>-ım</b> identifies <b>I</b>. The -DIK form does <b>not always mean past tense</b>; time depends on context.</p>`;
 else html=`<div class="roundbar"><span class="bubble">BÖLÜM 3 · -DIK examples</span><span class="counter">${page+1}/4</span></div><h2 class="heading english">See how the Turkish phrase works</h2><div class="grammar-example"><p class="grammar-phrase">${esc(x.phrase)} <button class="sound" style="display:inline-grid;vertical-align:middle;width:38px;height:38px;font-size:18px" type="button" aria-label="Türkçe telaffuz" onclick="speak(grammar[page].phrase)">🔊</button></p></div><div class="morph"><span class="part stem">${esc(x.parts[0])}</span><span class="plus">+</span><span class="part suffix">${esc(x.parts[1])}</span><span class="plus">+</span><span class="part person">${esc(x.parts[2])}</span></div><p class="gloss english"><b>${esc(x.labels[0])}</b> + <b>${esc(x.labels[1])}</b> + <b>${esc(x.labels[2])}</b></p><div class="panels english"><div class="panel"><h3>Literal translation (word by word)</h3><p><strong>${esc(x.literal)}</strong></p></div><div class="panel"><h3>Natural English translation</h3><p><strong>${esc(x.natural)}</strong></p></div></div><div class="note english">${esc(x.explain)}<br><span class="smaller">The literal gloss explains the structure; it is not a natural English sentence.</span></div>`}
 if(stage===4){const q=blanks[page],tier=Math.floor(page/2)+1,checked=clozeChecked[page],value=clozeAnswers[page]??'';html=`<div class="roundbar"><span class="bubble">BÖLÜM 4 · -DIK ile tamamla</span><span class="counter">${page+1}/6 · Aşama ${tier}/3</span></div><h2 class="heading">Boşluğu tamamla</h2><p class="lead english">${esc(q.level)} · No multiple-choice options</p><div class="fill-preview english"><span class="subhead">English</span><div class="translation">${esc(q.en)}</div></div><div class="cloze"><span>${esc(q.before)}</span><input id="clozeInput" type="text" lang="tr" aria-label="Eksik Türkçe ifadeyi yaz" class="${checked===true?'correct':checked===false?'wrong':''}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${tier===1?'ek':tier===2?'fiil':'tam ifade'}" value="${esc(value)}" oninput="captureCloze()" onkeydown="if(event.key==='Enter'){event.preventDefault();checkCloze()}"/><span>${esc(q.after)}</span></div><div style="text-align:center"><button class="btn primary tiny" type="button" onclick="checkCloze()">✓ Kontrol et</button></div><div id="feedback" class="feedback ${checked===false?'bad':''}" aria-live="polite">${checked===true?'✓ Doğru! '+esc(q.explain):checked===false?'Tekrar dene. Ek ve kişi uyumuna dikkat et.':''}</div>`}
 if(stage===5){const q=meanings[page];html=`<div class="roundbar"><span class="bubble">BÖLÜM 5 · Şarkının anlamı</span><span class="counter">${page+1}/4</span></div><h2 class="heading">Sen ne düşünüyorsun?</h2><p class="question">${esc(q.q)}</p><label class="smaller" for="writeAnswer">Cevabın:</label><textarea id="writeAnswer" placeholder="Kendi cümlelerinle yaz…" oninput="written[page]=this.value">${esc(written[page]||'')}</textarea><div><button type="button" class="btn ghost tiny" onclick="showHint()">${hintVisible?'İpucunu gizle':'💡 İpucu'}</button></div>${hintVisible?`<div class="note">${esc(q.hint)}</div>`:''}${page===3?'<div class="note"><b>Mecaz:</b> “Yükü omzundan atmak” = zor bir durumdan veya duygusal ağırlıktan kurtulmak.</div>':''}`}
 if(stage===6){const q=lyrics[page];html=`<div class="roundbar"><span class="bubble">BÖLÜM 6 · İngilizce çeviri</span><span class="counter">${page+1}/5</span></div><h2 class="heading">İngilizcesi nedir?</h2><div class="lyric-card"><span class="subhead">Türkçe şarkı sözü</span><blockquote>${esc(q.tr)}</blockquote><button type="button" class="sound" aria-label="Dizeyi dinle" onclick="speak(lyrics[page].tr)">🔊</button></div><label class="smaller" for="translateAnswer">Write your English translation:</label><textarea lang="en" id="translateAnswer" placeholder="Type your English translation here…" spellcheck="true" oninput="translations[page]=this.value">${esc(translations[page]||'')}</textarea><div><button type="button" class="btn ghost tiny" onclick="toggleSample()">${sampleShown[page]?'Örnek çeviriyi gizle':'Örnek çeviriyi gör'}</button></div>${sampleShown[page]?`<div class="sample-answer english"><b>Suggested translation:</b><p style="margin:6px 0 0">${esc(q.en)}</p><span class="smaller">Other natural translations are also possible.</span></div>`:''}`}
 if(stage===7){const correctV=Object.values(accepted[1]).filter(Boolean).length,correctD=Object.values(accepted[2]).filter(Boolean).length,correctC=Object.values(clozeChecked).filter(Boolean).length,writtenCount=Object.values(written).filter(v=>String(v).trim()).length,translatedCount=Object.values(translations).filter(v=>String(v).trim()).length;html=`<div class="huge">🌟</div><h1 class="bigword" style="font-size:clamp(30px,5vw,51px)">Tebrikler!</h1><p class="lead">Bütün bölümleri tamamladın.</p><div class="done-stat">${correctV+correctD+correctC} / 38</div><div class="note" style="text-align:center"><b>27</b> kelime sorusu · <b>5</b> Türkçe anlam sorusu · <b>6</b> boşluk doldurma<br><b>${writtenCount}</b> yorum cevabı · <b>${translatedCount}/5</b> İngilizce çeviri</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" class="btn primary" onclick="downloadAnswers()">⬇ Cevaplarımı kaydet</button><button type="button" class="btn ghost" onclick="restart()">↻ Baştan başla</button></div>`}
 $('content').className='content'+([0,7].includes(stage)?' center':'');$('content').innerHTML=html;$('content').scrollTop=0;
}
function downloadAnswers(){saveOpenAnswer();const lines=['YOLUN BAŞI – B1 TÜRKÇE DERSİ','Sertab Erener','','BÖLÜM 1 · KELİMELER'];vocabulary.forEach((q,i)=>lines.push(`${i+1}. ${words[q.wordIndex].tr} | ${words[q.wordIndex].en} | ${accepted[1][i]?'Doğru':'Boş / yanlış'}`));lines.push('','BÖLÜM 2 · TÜRKÇE ANLAM');definitions.forEach((q,i)=>lines.push(`${i+1}. ${q.q} | Doğru cevap: ${q.options[q.correctAt]} | ${accepted[2][i]?'Doğru':'Boş / yanlış'}`));lines.push('','BÖLÜM 3 · -DIK GRAMMAR EXPLANATION','içtiğin / sevdiğin / sandığım');lines.push('','BÖLÜM 4 · BOŞLUK DOLDURMA');blanks.forEach((q,i)=>lines.push(`${i+1}. ${q.en} | Benim cevabım: ${clozeAnswers[i]||'—'} | Doğru cevap: ${q.answer}`));lines.push('','BÖLÜM 5 · ŞARKININ ANLAMI');meanings.forEach((q,i)=>lines.push(`${i+1}. ${q.q}\n${written[i]||'—'}`));lines.push('','BÖLÜM 6 · İNGİLİZCE ÇEVİRİ');lyrics.forEach((q,i)=>lines.push(`${i+1}. ${q.tr}\nÖğrencinin cevabı: ${translations[i]||'—'}\nÖrnek çeviri: ${q.en}`));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Yolun_Basi_B1_Ogrenci_Cevaplari.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('keydown',ev=>{if(ev.target&&['INPUT','TEXTAREA'].includes(ev.target.tagName))return;if(ev.key==='ArrowRight'&&!ev.repeat)stepNext();if(ev.key==='ArrowLeft'&&!ev.repeat)stepBack()});
render();
</script>
